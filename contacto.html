<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Yahuarcocha Tours</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Logo Yahuarcocha Tours">
            <h1>Yahuarcocha Tours</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="destinos.html">Lugares Turísticos</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 class="section-title" style="margin-top: 2rem;">Contacto y Reserva</h2>

        <div class="form-container">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre completo">
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="0991234567">
                </div>

                <div class="form-group">
                    <label for="destino">Destino o actividad:</label>
                    <input type="text" id="destino" name="destino" required placeholder="Ej. Bote en Yahuarcocha">
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha tentativa:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="personas">Número de personas:</label>
                    <input type="number" id="personas" name="personas" min="1" max="50" required placeholder="1">
                </div>

                <div class="form-group">
                    <label for="tipo_servicio">Tipo de servicio:</label>
                    <select id="tipo_servicio" name="tipo_servicio" required>
                        <option value="">-- Seleccionar tipo --</option>
                        <option value="naturaleza">Tour de Naturaleza</option>
                        <option value="gastronomico">Tour Gastronómico</option>
                        <option value="cultural">Tour Cultural</option>
                        <option value="aventura">Tour de Aventura</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" placeholder="Detalle su mensaje o requerimiento adicional..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Enviar Reserva</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Yahuarcocha Tours - Agencia Ficticia de Turismo. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
